name: ci
on:
  push: { branches: [main, 'release/*'] }
  pull_request: {}
  # V6-06: declared schedule — the nightly/soak jobs gate on this event.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

# V6-06: least privilege on every job (see per-job blocks below). The
# github-script PR comment in binary-size needs issues:write.
permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  # CI-W1 (V5 Wave 2): cross-platform gate. M-13 cfg-gates all unix-only
  # code, so Windows builds cleanly; the platform-agnostic test subset
  # runs natively (unix-perm tests are skipped by name).
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target x86_64-pc-windows-msvc --all-targets --locked
      # V6-OPS-03: the old `--skip platform_unix` matched ZERO test names
      # (dead filter); the full platform-agnostic suite runs natively now.
      - run: cargo test --target x86_64-pc-windows-msvc --locked

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit cargo-deny
      # V6-OPS-02: unmaintained advisories MUST carry an audit.toml rationale;
      # an unallowlisted warning now fails the build.
      - run: cargo audit --deny warnings
      - run: cargo deny check

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          lint: true
          breaking: true

  # CI rule `no-handler-validation` (M-04, V5 rule 15): validation lives
  # in core::validation, never in a handler. Drift cannot re-enter
  # silently.
  no-handler-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_no_handler_validation.sh

  # CI-W2 (V5 §7.2), REPAIRED per V6-05: the shipped (secretless) config
  # MUST refuse to boot naming its violations, a secreted config MUST boot
  # and serve /health, and the old bootstrap password MUST be rejected.
  # Rule 19 (CI liveness): ci-liveness.yml proves daily that this gate
  # actually fails on broken input.
  c01-boot-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin file-storage
      - name: shipped config MUST refuse to boot (exit captured WITHOUT a pipe)
        run: |
          set +e
          ./target/release/file-storage --config config/production.yaml > /tmp/boot.txt 2>&1
          code=$?
          set -e
          cat /tmp/boot.txt
          if [ "$code" -eq 0 ]; then
            echo "C-01 VIOLATION: secretless config booted"; exit 1
          fi
          # Match the ACTUAL boot-failure wording (lib.rs context +
          # config.rs violation list), not a guessed word.
          grep -qiE 'invalid configuration|jwt_secret|api_key|argon2|password' /tmp/boot.txt             || { echo "refusal must name its violations"; exit 1; }
      - name: secreted config MUST boot and serve /health
        run: |
          # F4: the example config ships /var/lib paths (unwritable on
          # the runner); override the four state dirs - the same
          # mechanism tests/regression_c01_boot.rs uses.
          export FS_STORAGE__ROOT=/tmp/fsdata/blocks
          export FS_STORAGE__TEMP_DIR=/tmp/fsdata/tmp
          export FS_DATABASE__PATH=/tmp/fsdata/index.redb
          export FS_ENCRYPTION__KEYS_DIR=/tmp/fsdata/keys
          mkdir -p /tmp/fsdata
          cp secrets/file-storage.yaml.example /tmp/secretful.yaml
          sed -i "s/PASTE_openssl_rand_hex_32_HERE/$(openssl rand -hex 32)/" /tmp/secretful.yaml
          sed -i "s/PASTE_openssl_rand_hex_24_HERE/$(openssl rand -hex 24)/" /tmp/secretful.yaml
          HASH=$(./target/release/file-storage hash-password --password bootstrap-admin-pw-1)
          sed -i "s|PASTE_FILE_STORAGE_HASH_PASSWORD_OUTPUT_HERE|$HASH|" /tmp/secretful.yaml
          ./target/release/file-storage --config /tmp/secretful.yaml &
          PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break || sleep 1; done
          curl -sf http://127.0.0.1:8080/health > /dev/null || { kill $PID 2>/dev/null || true; echo "no /health"; exit 1; }
          # admin123 (the C-01 shipped literal) MUST fail.
          if curl -sf -X POST http://127.0.0.1:8080/api/v1/auth/login               -H 'Content-Type: application/json'               -d '{"username":"admin","password":"admin123"}' > /dev/null; then
            kill $PID 2>/dev/null || true
            echo "C-01 VIOLATION: admin123 authenticated"; exit 1
          fi
          kill $PID 2>/dev/null || true

  # CI-W3 (V5 §7.3): binary-size regression guard. Baseline 12 MiB
  # (post-Wave-1); fail past 15 MiB (25% growth). Size reported on the PR.
  binary-size:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-unknown-linux-musl --bin file-storage
      - id: size
        run: |
          SIZE=$(stat -c%s target/x86_64-unknown-linux-musl/release/file-storage)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          if [ "$SIZE" -gt 15728640 ]; then
            echo "FAIL: binary grew past 15 MiB (got $SIZE bytes)"
            exit 1
          fi
      - uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Binary size (musl release): ${{ steps.size.outputs.size }} bytes`
            })

  # CI-W5 (V5 §7.5): dashboard smoke — the series the Grafana dashboard
  # and alert rules depend on must exist on a live stack.
  dashboard-smoke:
    runs-on: ubuntu-latest
    needs: [clippy-test-linux]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin file-storage
      - name: boot secreted stack
        run: |
          # F4: writable state dirs on the runner (see c01-boot-gate).
          export FS_STORAGE__ROOT=/tmp/fsdash/blocks
          export FS_STORAGE__TEMP_DIR=/tmp/fsdash/tmp
          export FS_DATABASE__PATH=/tmp/fsdash/index.redb
          export FS_ENCRYPTION__KEYS_DIR=/tmp/fsdash/keys
          mkdir -p /tmp/fsdash
          cp secrets/file-storage.yaml.example /tmp/secretful.yaml
          sed -i "s/PASTE_openssl_rand_hex_32_HERE/$(openssl rand -hex 32)/" /tmp/secretful.yaml
          sed -i "s/PASTE_openssl_rand_hex_24_HERE/$(openssl rand -hex 24)/" /tmp/secretful.yaml
          HASH=$(./target/release/file-storage hash-password --password bootstrap-admin-pw-1)
          sed -i "s|PASTE_FILE_STORAGE_HASH_PASSWORD_OUTPUT_HERE|$HASH|" /tmp/secretful.yaml
          ./target/release/file-storage --config /tmp/secretful.yaml &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break || sleep 1; done
          curl -sf http://127.0.0.1:8080/health > /dev/null
      - run: ./scripts/dashboard_smoke.sh http://127.0.0.1:8080
      - name: stop
        if: always()
        run: kill -9 %1 2>/dev/null || true

  docker:
    runs-on: ubuntu-latest
    needs: [clippy-test-linux]
    steps:
      - uses: actions/checkout@v4
      # F5: BUILD the local tree with the exact tag docker-compose.yml
      # references. Without this, compose pulls the STALE published
      # image (predates the remediation waves) and the PoC runs old
      # code - the 000/6-ATTACKS CI failure.
      - name: build local image with the compose tag
        run: |
          COMPOSE_TAG=$(grep -m1 'image:' docker-compose.yml | awk '{print $2}')
          echo "building local image tagged: $COMPOSE_TAG"
          docker build -t "$COMPOSE_TAG" .
      - name: C-01 gate — secretless boot must fail
        run: |
          set +e
          COMPOSE_TAG=$(grep -m1 'image:' docker-compose.yml | awk '{print $2}')
          docker run --rm "$COMPOSE_TAG" --config /run/secrets/file-storage.yaml
          code=$?
          set -e
          test "$code" -ne 0 || { echo "C-01 VIOLATION: booted without secrets"; exit 1; }
      - name: secretful boot + expect-fail smoke
        run: |
          cp secrets/file-storage.yaml.example secrets/file-storage.yaml
          sed -i "s/PASTE_openssl_rand_hex_32_HERE/$(openssl rand -hex 32)/" secrets/file-storage.yaml
          sed -i "s/PASTE_openssl_rand_hex_24_HERE/$(openssl rand -hex 24)/" secrets/file-storage.yaml
          COMPOSE_TAG=$(grep -m1 'image:' docker-compose.yml | awk '{print $2}')
          HASH=$(docker run --rm --entrypoint /usr/local/bin/file-storage "$COMPOSE_TAG" hash-password --password bootstrap-admin-pw-1)
          sed -i "s|PASTE_FILE_STORAGE_HASH_PASSWORD_OUTPUT_HERE|$HASH|" secrets/file-storage.yaml
          # The local tag built above IS the image compose uses (no pull).
          docker compose up -d --wait --pull never
          docker compose ps
          bash poc_expect_fail.sh

  # V6-06 REPAIR: the old nightly job was gated on `schedule` that the
  # `on:` block never declared — unreachable, so the H-01 RSS gate ran
  # nowhere. Now: declared schedule + manual dispatch + permissions.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: H-01 memory bound (the ONLY consumer of the ignored RSS test)
        run: |
          cargo build --release --bin file-storage
          cargo test --locked --release --test regression_hardening h01_upload_memory_bound -- --include-ignored --nocapture
      - name: benches
        run: cargo bench --bench throughput -- --warm-up-time 1 --measurement-time 3 || true
      - name: upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: target/criterion
          if-no-files-found: ignore

  soak:
    # V7-P1 soak promotion: long-running upload/delete/GC/reconcile loop.
    # 60-minute CI slice; the full 24h run is operator-dispatched.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --release --test soak -- --include-ignored --nocapture
        continue-on-error: false
