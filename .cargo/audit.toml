# cargo-audit configuration (V6-OPS-02). cargo-audit 0.23 discovers this
# file at `.cargo/audit.toml` (CWD audit.toml is NOT read in 0.23 —
# verified by probe: invalid TOML there is silently ignored).
#
# CI runs `cargo audit --deny warnings` (security job): a NEW advisory or
# an unlisted warning fails the build. Quarterly re-evaluation required
# for every entry below (see docs/dependency-review.md).

[advisories]
# RUSTSEC-2025-0141 — bincode 1.3.3 unmaintained (RUSTSEC-2025-0141, no
# fixed upgrade). Rationale: bincode serializes ONLY the internal
# `ChunkMeta` rows of the redb chunks table (src/storage/index_db.rs) —
# a self-produced format read back from our own database. Corrupt rows
# map to StorageError::Serialization (handled; no panic path — H-04's
# clamp covers the other untrusted-input family). No wire protocol uses
# bincode. Risk accepted until the storage-format migration (P2: fold
# into the M-03 summary-row work, which rewrites chunk metadata anyway).
# Re-evaluate: quarterly, and at the start of any storage-format work.
#
# RUSTSEC-2025-0134 — rustls-pemfile 2.2.0 unmaintained (merged upstream
# into rustls-pki-types). This crate never calls it directly: transitive
# via tonic 0.12's TLS stack for PEM parsing of operator-supplied certs
# at server start (grpc_tls paths), not per-request. Re-evaluate:
# quarterly, and at the next tonic upgrade (0.13+ drops it entirely).
ignore = ["RUSTSEC-2025-0141", "RUSTSEC-2025-0134"]
