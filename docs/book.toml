[book]
title = "file-storage documentation"
authors = ["file-storage team"]
language = "en"
src = "src"

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/your-org/file-storage"
edit-url-template = "https://github.com/your-org/file-storage/edit/main/docs/src/{path}"
additional-css = ["theme/custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 0

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
