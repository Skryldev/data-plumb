# deny.toml — cargo-deny policy (M-15)
# advisories: default RustSec DB; bans: warn on duplicates first (tighten
# after the first green run); licenses: permissive allowlist.

[advisories]
version = 2
yanked = "warn"
# V6-OPS-02: unmaintained advisories carry reviewed rationale in
# .cargo/audit.toml (cargo-audit's discovery path) and are re-evaluated
# quarterly. cargo-deny shares the RustSec DB, so the same two IDs are
# exempted here (see that file for the full rationale prose).
ignore = ["RUSTSEC-2025-0141", "RUSTSEC-2025-0134"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  # tiny-keccak 2.0.2 (transitive via blake3) is CC0-1.0 — public-domain
  # equivalent, permissive in every practical sense. Reviewed 2026-11.
  "CC0-1.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
