[package]
name = "file-storage"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Production-grade hybrid chunked content-addressed file storage microservice"
license = "MIT"

[lib]
name = "file_storage"
path = "src/lib.rs"

[[bin]]
name = "file-storage"
path = "src/main.rs"



[dependencies]
# Async runtime & HTTP
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "catch-panic"] }
hyper = "1"
bytes = "1"
futures = "0.3"
async-stream = "0.3"

# Storage core
blake3 = "1.5"
zstd = "0.13"
fastcdc = { version = "5", features = ["tokio"] }
redb = "2.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rmp-serde = "1.3"
config = { version = "0.14", features = ["yaml"] }

# Caching
moka = { version = "0.12", features = ["future"] }

# Security
jsonwebtoken = "9.3"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
dashmap = "5"
base64 = "0.22"

# Rate limiting
tower_governor = "0.4"
governor = "0.6"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Replication client (cluster-internal plain HTTP)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }

# ── gRPC ──
tonic = { version = "0.12", features = ["tls", "tls-roots", "gzip"] }
prost = "0.13"
prost-types = "0.13"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
http = "1"
http-body = "1"
tower = { version = "0.4", features = ["util"] }
tower-layer = "0.3"

# Reflection + health checking
tonic-reflection = "0.12"
tonic-health = "0.12"

# TLS crypto provider pinning: tonic and rcgen may both link rustls with
# different providers; pin `ring` explicitly so handshakes are deterministic.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Utilities
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
hex = "0.4"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }
# Hermetic protoc: ships the compiler + well-known-type includes in-crate so
# builds never depend on a system protobuf installation.
protoc-bin-vendored = "3"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
serde_json = "1"
blake3 = "1.5"
futures = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
rcgen = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
